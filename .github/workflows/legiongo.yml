name: legiongo

# Eigener Windows-Build für den Lenovo Legion Go (MSVC, AVX2, LTO).
# Startet bei jedem Push auf den Zweig legiongo oder von Hand: Actions > legiongo > Run workflow.

on:
  push:
    branches:
      - legiongo
  workflow_dispatch:
    inputs:
      lto:
        description: LTO einschalten (aus, falls der Build daran scheitert)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: windows-x86_64-legiongo
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK on Windows
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        shell: pwsh
        run: glslangValidator --version

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DYUZU_LEGION_GO=ON
          -DENABLE_QT_TRANSLATION=ON
          -DENABLE_LTO=${{ (github.event_name == 'push' || inputs.lto) && 'ON' || 'OFF' }}

      - name: Build
        shell: bash
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 3

      - name: Package Windows binary
        shell: pwsh
        run: |
          foreach ($exe in 'eglantine.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --translations de build/release/bin/eglantine.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-windows-x86_64-legiongo-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 14
